<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple, local jewelry inventory prototype. Find a piece, read its inventory card, and add or edit items.">
  <meta name="theme-color" content="#086b8a">
  <title>Jewelry inventory</title>
  <style>
:root {
  color-scheme: light;
  --accent: #086b8a;
  --accent-dark: #064d66;
  --ink: #20323c;
  --muted: #596b76;
  --line: #d5e4eb;
  --soft: #eaf3f7;
  --background: #f5f9fb;
  --error: #a32c29;

  --focus-ring: color-mix(in srgb, var(--accent) 18%, transparent);

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 18px;
  line-height: 1.5;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--ink); }
button, input, select { font: inherit; }
button, a, input, select, label[for="photo-input"] { -webkit-tap-highlight-color: transparent; }
button, label[for="photo-input"] { cursor: pointer; }
button:disabled { cursor: wait; opacity: .7; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
a { color: var(--accent); text-underline-offset: 4px; }
h1, h2, h3, p, dl { margin: 0; }
h1 { font-size: 2.35rem; line-height: 1.2; letter-spacing: -.035em; font-weight: 650; }
h2 { font-size: 1.3rem; line-height: 1.35; font-weight: 630; letter-spacing: -.02em; }
h3 { font-size: 1.1rem; line-height: 1.4; font-weight: 630; }
strong { font-weight: 620; }
h1, dd, .inventory-number, .style-cell, .price-cell, .detail-subtitle, .financial-row > div { overflow-wrap: anywhere; min-width: 0; }
.page-heading > div { min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; top: -100px; left: 20px; z-index: 20; padding: 10px 20px; background: white; }
.skip-link:focus { top: 10px; }
.app-header { background: white; border-bottom: 1px solid var(--line); }
.header-inner { max-width: 1260px; margin: auto; min-height: 92px; padding: 16px 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: inline-flex; align-items: center; gap: 14px; border: 0; padding: 0; background: transparent; color: var(--ink); text-align: left; min-width: 0; flex: 0 1 auto; }
.brand-copy { display: block; min-width: 0; }
.brand-name { display: block; font-size: 1.05rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.3; }

.brand-logo { display: block; width: auto; height: 60px; object-fit: contain; }
.local-label { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .8rem; }
.local-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.page { max-width: 1260px; padding: 48px 30px 64px; margin: 0 auto; min-height: calc(100vh - 210px); }
.page:focus { outline: none; }
.page-heading { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
.eyebrow { font-size: .7rem; font-weight: 650; letter-spacing: .14em; color: var(--muted); margin-bottom: 10px; }
.intro { color: var(--muted); margin-top: 12px; }
.button { border: 1px solid var(--line); background: white; color: var(--accent-dark); border-radius: 8px; min-height: 48px; padding: 10px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: .94rem; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.button:hover { background: var(--soft); border-color: var(--accent); }
.button.primary { background: var(--accent); border-color: var(--accent); color: white; padding: 12px 24px; }
.button.primary:hover { background: var(--accent-dark); }
.button.text-button { background: transparent; border-color: transparent; padding-left: 6px; padding-right: 6px; }
.button.text-button:hover { background: var(--soft); }
.search-area { margin-bottom: 30px; }
.search-area label { display: block; font-size: .94rem; font-weight: 600; margin-bottom: 10px; }
.search-control { position: relative; display: flex; align-items: center; gap: 12px; background: white; border: 1px solid var(--control-line); border-radius: 10px; padding: 0 16px; max-width: 760px; }
.search-control:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus-ring); }
.search-control svg { width: 23px; height: 23px; flex: 0 0 auto; color: var(--muted); }
.search-control input { background: transparent; border: 0; min-height: 62px; width: 100%; min-width: 0; color: var(--ink); outline: 0; }
.search-control input::placeholder { color: var(--muted); }
.search-control input::-webkit-search-cancel-button { display: none; }
.search-clear { font-size: .8rem; flex: 0 0 auto; }
.list-summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .82rem; color: var(--muted); margin-bottom: 12px; }

.list-head, .inventory-row { display: grid; grid-template-columns: 96px minmax(150px, 1.2fr) minmax(110px, .9fr) minmax(170px, 1.1fr) minmax(110px, .85fr) 137px; gap: 22px; align-items: center; padding: 20px 26px; }
.list-head { background: var(--soft); font-size: .75rem; color: var(--muted); padding-top: 16px; padding-bottom: 16px; font-weight: 600; border-bottom: 1px solid var(--line); }

.inventory-row:hover { background: var(--hover); }
.thumbnail { width: 86px; height: 82px; border-radius: 7px; overflow: hidden; }
.inventory-photo { width: 100%; height: 100%; object-fit: cover; display: block; }

.sample-label { display: block; font-size: .72rem; color: var(--muted); margin-top: 5px; }

.photo-placeholder svg { width: 31px; height: 31px; }
.photo-placeholder.large { min-height: 395px; padding: 32px; font-size: 1rem; gap: 12px; color: var(--muted); }
.photo-placeholder.large svg { width: 68px; height: 68px; color: var(--muted); margin-bottom: 6px; }
.photo-placeholder.large small { font-size: .81rem; text-align: center; color: var(--muted); }
.not-provided { color: var(--muted); font-weight: 400; }
.price-cell .not-provided { font-size: .9rem; }
.status { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 6px; background: #f0f1ef; color: #535e58; font-weight: 550; font-size: .79rem; white-space: nowrap; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-available { background: #e8f3ed; color: #23624d; }
.status-sold { background: #eeedf0; color: #655d6d; }
.mobile-label { display: none; }
.sample-note { color: var(--muted); font-size: .77rem; margin-top: 18px; line-height: 1.7; }
.empty-state { text-align: center; padding: 70px 24px; border: 1px solid var(--line); background: white; border-radius: 12px; }
.empty-state p { color: var(--muted); margin: 14px 0 24px; }
.app-footer { max-width: 1260px; margin: auto; padding: 22px 30px 28px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); gap: 20px; color: var(--muted); font-size: .73rem; }
.footer-links { display: flex; align-items: center; gap: 22px; }
.footer-links a { min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; }
.footer-links a:hover { text-decoration: underline; }
.back-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
.back-row .eyebrow { margin: 0; }
.back-button { margin-left: -6px; }
.detail-page { padding-top: 27px; }
.detail-heading { margin-bottom: 28px; }
.detail-subtitle { display: flex; align-items: center; gap: 20px; margin-top: 12px; color: var(--muted); }
.detail-subtitle strong { color: var(--ink); margin-left: 7px; }
.fictional-note { color: var(--muted); font-size: .8rem; margin-top: 8px; }
.detail-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start; }
.large-photo { border: 1px solid var(--line); border-radius: 12px; background: var(--soft); overflow: hidden; aspect-ratio: 1.1; }
.large-photo .photo-placeholder { height: 100%; min-height: unset; }
.detail-photo { display: block; width: 100%; height: 100%; object-fit: contain; }
.photo-caption { font-size: .79rem; color: var(--muted); margin: 15px 2px; }
.photo-thumbnails { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
.photo-thumb { padding: 4px; border: 2px solid transparent; border-radius: 8px; background: white; color: var(--ink); min-width: 90px; }
.photo-thumb.selected { border-color: var(--accent); }
.photo-thumb img { width: 84px; height: 72px; object-fit: cover; display: block; border-radius: 4px; }
.photo-thumb span { display: block; font-size: .69rem; margin: 6px 0 3px; }
.item-card { background: white; padding: 26px 30px; border: 1px solid var(--line); border-radius: 12px; }
.retail-block { border-bottom: 1px solid var(--line); padding-bottom: 20px; }
.row-label, dt { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 6px; }
.retail-price { font-size: 2.15rem; line-height: 1.25; font-weight: 650; letter-spacing: -.035em; color: var(--accent-dark); }
.retail-price .not-provided { font-size: 1.35rem; }
.material-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 22px 0; border-bottom: 1px solid var(--line); }
dd { margin: 0; font-weight: 570; }
.financial-section h2 { font-size: 1rem; margin: 22px 0 4px; }
.financial-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; padding: 17px 0; border-bottom: 1px solid var(--line); }
.financial-row strong { font-size: 1.05rem; }
.financial-row small { font-size: .77rem; font-weight: 400; color: var(--muted); }
.code-value { border-left: 1px solid var(--line); padding-left: 20px; font-size: .9rem; overflow-wrap: anywhere; }
.code-value .not-provided { font-size: .85rem; }
.insurance-row { border: 0; padding-bottom: 0; }
.gemstone-section { margin-top: 45px; padding-top: 30px; border-top: 1px solid var(--line); }
.section-heading { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.section-count { font-size: .78rem; color: var(--muted); padding: 4px 10px; border-radius: 6px; background: var(--soft); }
.gemstone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.gemstone-card { background: white; padding: 24px 28px; border: 1px solid var(--line); border-radius: 10px; }
.gemstone-title { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.group-index { color: var(--accent); font-size: .75rem; font-weight: 600; background: var(--soft); padding: 5px 8px; border-radius: 5px; }
.gemstone-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.carat-help { margin-top: 10px !important; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
.gemstone-card .financial-row:last-child { border-bottom: 0; padding-bottom: 0; }
.empty-groups { padding: 20px 0; }
.save-confirmation { display: flex; align-items: center; gap: 10px; background: #e7f2eb; color: #1d5d43; padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; font-weight: 550; }
.editor-page { max-width: 1140px; }
.form-guide { display: flex; flex-direction: column; gap: 5px; margin-bottom: 28px; padding: 0 0 0 16px; border-left: 3px solid var(--accent); font-size: .88rem; }
.form-guide span { color: var(--muted); }
.form-section { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 28px 32px 32px; margin-bottom: 22px; }
.form-section-title { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 26px; }
.form-section-title p { font-size: .85rem; color: var(--muted); margin-top: 6px; }
.section-number { color: var(--accent); font-size: .75rem; font-weight: 650; line-height: 1.75; background: var(--soft); padding: 4px 8px; border-radius: 5px; }
.fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 30px; align-items: start; }
.field label { display: block; font-size: .86rem; font-weight: 600; margin-bottom: 8px; }
.field input, .field select { width: 100%; height: 50px; background: white; color: var(--ink); border: 1px solid var(--control-line); border-radius: 7px; padding: 10px 12px; min-width: 0; }
.field select { padding-right: 26px; }
.field input:hover, .field select:hover { border-color: var(--accent); }
.field input[aria-invalid="true"], .field select[aria-invalid="true"] { border: 2px solid var(--error); }
.field-help { color: var(--muted); font-size: .76rem; line-height: 1.6; margin-top: 7px; }
.field-error { color: var(--error); font-size: .82rem; margin-top: 7px; line-height: 1.5; }
.required-label { color: var(--muted); font-size: .68rem; font-weight: 400; margin-left: 6px; }
.amount-code-pair { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
.date-pair, .quantity-carats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.date-fields .text-button { font-size: .8rem; margin-top: 3px; }
.no-photos { display: flex; align-items: center; gap: 18px; padding: 22px; background: var(--soft); border-radius: 8px; color: var(--muted); font-size: .86rem; margin-bottom: 18px; }
.no-photos strong { color: var(--ink); font-weight: 550; }
.photo-upload { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
.photo-upload p { color: var(--muted); font-size: .76rem; }
.photo-upload:focus-within label { outline: 3px solid var(--accent); outline-offset: 3px; }
.editor-photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.editor-photo { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.editor-photo img { display: block; width: 100%; height: 155px; object-fit: contain; background: var(--soft); border-radius: 4px; }
.photo-name { color: var(--muted); font-size: .72rem; margin: 9px 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.photo-controls { display: flex; align-items: stretch; flex-direction: column; gap: 4px; }
.photo-controls .button { min-height: 44px; font-size: .81rem; }
.cover-label { min-height: 44px; display: flex; align-items: center; justify-content: center; color: var(--accent-dark); font-size: .83rem; font-weight: 600; }

.no-groups { font-size: .87rem; color: var(--muted); margin-bottom: 20px; }
.editor-group { border: 1px solid var(--line); background: var(--hover); border-radius: 9px; padding: 20px 24px 24px; margin-bottom: 20px; }
.editor-group-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 15px; }

.pricing-help { color: var(--muted); font-size: .83rem; align-self: center; }
.form-actions { position: sticky; bottom: 0; background: #fffffffa; border: 1px solid var(--line); border-radius: 10px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; box-shadow: 0 -4px 20px #202c2a04; }
.form-actions p { font-size: .76rem; color: var(--muted); max-width: 370px; }
.form-actions > div { display: flex; align-items: center; gap: 12px; }

.notice h2 { font-size: 1.1rem; margin-bottom: 8px; }
.error-notice { color: #8e2826; }
dialog { width: min(490px, calc(100vw - 36px)); border: 1px solid var(--line); padding: 30px; border-radius: 14px; color: var(--ink); box-shadow: 0 20px 80px #14292030; }

.dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
@media (max-width: 1100px) {

  .thumbnail { width: 72px; height: 74px; }

  <noscript><main><h1>Jewelry inventory</h1><p>Enable JavaScript in your browser to use this local prototype.</p></main></noscript>
  <script>
(() => {
'use strict';
const MATERIALS = ['Gold', 'Silver', 'Platinum', 'Palladium', 'Stainless steel', 'Other'];
const GEMSTONES = ['Emerald', 'Diamond', 'Ruby', 'Sapphire', 'Pearl', 'Amethyst', 'Topaz', 'Other'];
const STATUSES = ['Unknown', 'Available', 'Sold'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const newId = () => globalThis.crypto?.randomUUID?.() || `local-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
const clone = value => JSON.parse(JSON.stringify(value));
function emptyGroup() {
  return { id: newId(), type: '', quantity: '', carats: '', purchaseRate: '', purchaseCode: '', sellingRate: '', sellingCode: '' };
}
function emptyItem() {
  return { id: newId(), inventory: '', style: '', status: 'Unknown', material: '', month: '', year: '', materialCost: '', materialCode: '', productionCost: '', productionCode: '', retail: '', insurance: '', photos: [], groups: [], fictional: false };
}
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
}
const provided = value => value !== '' && value !== null && value !== undefined;
const textValue = value => provided(value) ? escapeHTML(value) : '<span class="not-provided">Not provided</span>';
function money(value) {
  if (!provided(value)) return '<span class="not-provided">Not provided</span>';
  const [whole, decimal] = String(value).split('.');
  const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return escapeHTML(`$${grouped}${decimal ? `.${decimal.padEnd(2, '0')}` : ''}`);
}
function carats(value) {
  if (!provided(value)) return '<span class="not-provided">Not provided</span>';
  const [whole, decimal = ''] = String(value).split('.');
  return escapeHTML(`${whole}.${decimal.padEnd(3, '0')}`);
}
function manufacture(item) {
  if (!item.month || !item.year) return '<span class="not-provided">Not provided</span>';
  return `${MONTHS[Number(item.month) - 1]} ${escapeHTML(item.year)}`;
}
function statusBadge(status) {
  return `<span class="status status-${status.toLowerCase()}"><span aria-hidden="true" class="status-dot"></span>${status}</span>`;
}
function photoPlaceholder(large = false) {
  return `<div class="photo-placeholder ${large ? 'large' : ''}"><svg aria-hidden="true" viewBox="0 0 48 48" fill="none"><rect x="8" y="10" width="32" height="28" rx="4" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="1.5"/><path d="m9 33 10-9 7 6 6-5 8 9" stroke="currentColor" stroke-width="1.5"/></svg><span>${large ? 'No photo provided' : 'No photo'}</span>${large ? '<small>Add a photograph when you edit this item.</small>' : ''}</div>`;
}
function photoImage(photo, className = '', alt = '') {
  return `<img class="${className}" src="${escapeHTML(photo.data)}" alt="${escapeHTML(alt || photo.name || 'Item photograph')}">`;
}


const e = escapeHTML;

const sampleData = [
  {
    id: 'piece-d2439', inventory: 'D2439', style: 'IR 891', status: 'Unknown',
    material: 'Gold', month: '4', year: '2026', materialCost: '670', materialCode: 'ROD',
    productionCost: '1240', productionCode: 'SIBD', retail: '2450', insurance: '1715', photos: [], fictional: false,
    groups: [
      { id: 'd2439-emerald', type: 'Emerald', quantity: '3', carats: '0.680', purchaseRate: '450', purchaseCode: '', sellingRate: '650', sellingCode: '' },
      { id: 'd2439-diamond', type: 'Diamond', quantity: '16', carats: '0.500', purchaseRate: '430', purchaseCode: '', sellingRate: '630', sellingCode: 'RLD' },
    ],
  },
  {
    id: 'sample-1001', inventory: 'DEMO-1001', style: 'IR 891', status: 'Available', material: 'Gold',
    month: '', year: '', materialCost: '', materialCode: '', productionCost: '', productionCode: '', retail: '2200', insurance: '',
    photos: [], groups: [], fictional: true,
  },
  {
    id: 'sample-1002', inventory: 'DEMO-1002', style: 'PN 204', status: 'Available', material: 'Silver',
    month: '', year: '', materialCost: '', materialCode: '', productionCost: '', productionCode: '', retail: '380', insurance: '',
    photos: [], groups: [], fictional: true,
  },
  {
    id: 'sample-1003', inventory: 'DEMO-1003', style: 'ER 512', status: 'Sold', material: 'Platinum',
    month: '', year: '', materialCost: '', materialCode: '', productionCost: '', productionCode: '', retail: '', insurance: '',
    photos: [], groups: [], fictional: true,
  },
];



const STORAGE_KEY = 'jewelry-inventory-standalone-v1';
function validNumeric(value) {
  return typeof value === 'string' && (value === '' || /^\d{1,12}(\.\d{1,6})?$/.test(value));
}
function validPhoto(photo) {
  return photo && typeof photo.id === 'string' && typeof photo.name === 'string' && typeof photo.data === 'string'
    && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(photo.data);
}
function validGroup(group) {
  return group && ['id', 'type', 'purchaseCode', 'sellingCode'].every(key => typeof group[key] === 'string')
    && ['quantity', 'carats', 'purchaseRate', 'sellingRate'].every(key => validNumeric(group[key]));
}
function validItem(item) {
  const textKeys = ['id', 'inventory', 'style', 'material', 'month', 'year', 'materialCode', 'productionCode'];
  return item && textKeys.every(key => typeof item[key] === 'string') && ['Unknown', 'Available', 'Sold'].includes(item.status)
    && ['materialCost', 'productionCost', 'retail', 'insurance'].every(key => validNumeric(item[key]))
    && Array.isArray(item.photos) && item.photos.every(validPhoto) && Array.isArray(item.groups) && item.groups.every(validGroup);
}
// Use a separate key so this file never writes to the original prototype's data.
let storagePersistent = true;
let storageNotice = '';
let memoryChanges = false;
function useMemory(message) {
  storagePersistent = false;
  storageNotice = `${message} Changes are kept only in memory for this open tab and will be lost when you close or reload it.`;
}
function loadItems() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch {
    useMemory('Browser storage is unavailable.');
    return { items: clone(sampleData), error: null };
  }
  if (raw === null) {
    const items = clone(sampleData);
    saveItems(items);
    return { items, error: null };
  }
  let saved;
  try {
    saved = JSON.parse(raw);
    if (saved.version !== 1 || !Array.isArray(saved.items) || !saved.items.every(validItem)) throw new Error('unreadable');
  } catch {
    useMemory('The existing saved inventory could not be opened and has not been overwritten. Showing the sample inventory.');
    return { items: clone(sampleData), error: null };
  }
  // Writing the identical value checks availability without changing saved data.
  saveItems(saved.items);
  return { items: saved.items, error: null };
}
function saveItems(items) {
  if (!storagePersistent) return false;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, items }));
    return true;
  } catch {
    useMemory('Browser storage is full or unavailable. The latest changes have not been saved to browser storage.');
    return false;
  }
}



const decimalPattern = /^\d+(?:\.\d+)?$/;
function normalizeDecimal(value) {
  const [whole, fraction] = value.split('.');
  const normalizedWhole = whole.replace(/^0+(?=\d)/, '');
  return fraction === undefined ? normalizedWhole : `${normalizedWhole}.${fraction}`;
}
function numeric(value, key, errors, { integer = false, maxDecimals = 2 } = {}) {
  const trimmed = String(value ?? '').trim();
  if (!trimmed) return '';
  if (!decimalPattern.test(trimmed)) {
    errors[key] = integer ? 'Enter a positive whole number, such as 3.' : 'Enter a number of zero or more, without a dollar sign or commas.';
    return trimmed;
  }
  const [whole, fraction = ''] = trimmed.split('.');
  if (integer && (fraction.length > 0 || Number(trimmed) < 1)) errors[key] = 'Enter a positive whole number, such as 3.';
  else if (whole.replace(/^0+/, '').length > 12) errors[key] = 'Use no more than 12 digits before the decimal point.';
  else if (fraction.length > maxDecimals) errors[key] = `Use no more than ${maxDecimals} decimal places.`;
  return normalizeDecimal(trimmed);
}
function validateItem(draft, items) {
  const item = clone(draft);
  const errors = {};
  for (const key of ['inventory', 'style', 'materialCode', 'productionCode']) item[key] = item[key].trim();
  if (!item.inventory) errors.inventory = 'Enter an inventory number.';
  else if (items.some(other => other.id !== item.id && other.inventory.trim().toLowerCase() === item.inventory.toLowerCase())) errors.inventory = 'This inventory number is already in use. Give each piece its own number.';
  if (!MATERIALS.includes(item.material)) errors.material = 'Choose the main material.';
  if (!STATUSES.includes(item.status)) errors.status = 'Choose Unknown, Available, or Sold.';
  item.year = String(item.year).trim();
  if ((item.month && !item.year) || (!item.month && item.year)) errors.year = 'Provide both month and year, or clear the date.';
  else if (item.year && (!/^\d{4}$/.test(item.year) || Number(item.year) < 1000 || Number(item.year) > 9999)) errors.year = 'Enter a four-digit year, such as 2026.';
  if (item.month && !/^(?:[1-9]|1[0-2])$/.test(item.month)) errors.month = 'Choose a month.';
  for (const key of ['materialCost', 'productionCost', 'retail', 'insurance']) item[key] = numeric(item[key], key, errors);
  item.groups.forEach(group => {
    for (const key of ['type', 'purchaseCode', 'sellingCode']) group[key] = group[key].trim();
    const prefix = `group-${group.id}-`;
    group.quantity = numeric(group.quantity, `${prefix}quantity`, errors, { integer: true, maxDecimals: 0 });
    group.carats = numeric(group.carats, `${prefix}carats`, errors, { maxDecimals: 6 });
    group.purchaseRate = numeric(group.purchaseRate, `${prefix}purchaseRate`, errors);
    group.sellingRate = numeric(group.sellingRate, `${prefix}sellingRate`, errors);
  });
  return { item, errors };
}



async function preparePhoto(file) {
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    throw new Error(`“${file.name}” could not be added. Choose a JPEG, PNG, or WebP image. For HEIC photos, export a JPEG from Photos first.`);
  }
  if (file.size > 20 * 1024 * 1024) throw new Error(`“${file.name}” is too large. Choose a photo smaller than 20 MB.`);
  const url = URL.createObjectURL(file);
  try {
    const image = await new Promise((resolve, reject) => {
      const loaded = new Image();
      loaded.onload = () => resolve(loaded);
      loaded.onerror = () => reject(new Error(`“${file.name}” could not be opened. Try another image.`));
      loaded.src = url;
    });
    const scale = Math.min(1, 1200 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext('2d');
    if (!context) throw new Error('This browser could not prepare the photo. Try again in Safari or Chrome.');
    context.fillStyle = '#ffffff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    const data = canvas.toDataURL('image/jpeg', 0.76);
    if (data.length > 900000) throw new Error(`“${file.name}” is too detailed for prototype storage. Choose a smaller photo.`);
    return { id: newId(), name: file.name, data };
  } finally {
    URL.revokeObjectURL(url);
  }
}



function button(label, action, options = {}) {

}

  }).join('')}</select>` : `<input id="${id}" name="${name}" value="${e(value)}" ${numeric ? `inputmode="${integer ? 'numeric' : 'decimal'}"` : ''} maxlength="${maxlength}" ${required ? 'aria-required="true"' : ''} aria-describedby="${descriptions}" autocomplete="off">`;
  return `<div class="field"><label for="${id}">${label}${required ? ' <span class="required-label">Required</span>' : ''}</label>${input}${help ? `<p class="field-help" id="${id}-help">${help}</p>` : ''}<p class="field-error" id="${id}-error" hidden></p></div>`;
}
function financialFields(amountLabel, amountKey, amount, codeLabel, codeKey, code, scope = '') {

function matchingItems(items, search) {
  const query = search.trim().toLowerCase();

}
function inventoryResults(items, search) {

  </div>`).join('')}</div>`;
}
function inventoryView(items, search, error) {

    ${error ? `<div class="notice error-notice" role="alert"><h2>Saved inventory is unavailable</h2><p>${e(error)}</p>${button('Try again', 'reload')}</div>` : `
    <div class="search-area"><label for="inventory-search">Search inventory or style number</label><div class="search-control"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8"/></svg><input type="search" id="inventory-search" value="${e(search)}" autocomplete="off" placeholder="For example, D2439 or IR 891">${button('Clear search', 'clear-search', { className: 'text-button search-clear', data: search ? '' : 'hidden' })}</div></div>
    <div class="list-summary"><p id="result-count" aria-live="polite">${count} ${count === 1 ? 'item' : 'items'}${search.trim() ? ' found' : ' in inventory'}</p><p>One record for each piece</p></div>

function detailView(item, confirmation = '') {

function editorPhotos(item) {
  if (!item.photos.length) return '<div class="no-photos"><strong>No photos added</strong><span>You can add photos now or later.</span></div>';
  return `<div class="editor-photo-grid">${item.photos.map((photo, index) => `<div class="editor-photo">${photoImage(photo)}<p class="photo-name" title="${e(photo.name)}">${e(photo.name)}</p><div class="photo-controls">${index === 0 ? '<span class="cover-label">✓ Cover photo</span>' : button('Make cover', 'make-cover', { data: `data-id="${e(photo.id)}"` })}${button('Remove photo', 'remove-photo', { className: 'text-button danger-text', data: `data-id="${e(photo.id)}" aria-label="Remove photo ${index + 1}"` })}</div></div>`).join('')}</div>`;
}
function materialSection(item) {
  return `<section class="form-section" aria-label="Material and material cost">${sectionTitle('03', 'Material and material cost')}<div class="fields-grid"><div>${field('Main material', 'material', item.material, { required: true, options: [['', 'Choose main material'], ...MATERIALS] })}<p class="field-help">Local lookup choices for this prototype.</p></div>${financialFields('Material cost ($)', 'materialCost', item.materialCost, 'Material cost code', 'materialCode', item.materialCode)}</div></section>`;
}
function gemstoneSection(item) {
  return `<section class="form-section" aria-label="Gemstone groups">${sectionTitle('04', 'Gemstone groups', 'Keep stones of the same type together in one group.')}<div id="editor-groups">${editorGroups(item)}</div>${button('<span aria-hidden="true">＋</span> Add gemstone group', 'add-group')}</section>`;
}
function editorGroups(item) {
  if (!item.groups.length) return '<p class="no-groups">No gemstone groups added. This section is optional.</p>';
  return item.groups.map((group, index) => `<div class="editor-group"><div class="editor-group-heading"><h3>Group ${index + 1}</h3>${button('Remove group', 'remove-group', { className: 'text-button danger-text', data: `data-id="${e(group.id)}" aria-label="Remove gemstone group ${index + 1}"` })}</div><div class="fields-grid group-fields">
  ${field('Gemstone type', 'type', group.type, { scope: group.id, options: [['', 'Not provided'], ...GEMSTONES, ...(!GEMSTONES.includes(group.type) && group.type ? [group.type] : [])] })}<div class="quantity-carats">${field('Quantity', 'quantity', group.quantity, { scope: group.id, numeric: true, integer: true })}${field('Total carats', 'carats', group.carats, { scope: group.id, numeric: true, help: 'Combined weight of all stones in this group.' })}</div>
  ${financialFields('Purchase rate per carat ($)', 'purchaseRate', group.purchaseRate, 'Purchase rate code', 'purchaseCode', group.purchaseCode, group.id)}${financialFields('Selling rate per carat ($)', 'sellingRate', group.sellingRate, 'Selling rate code', 'sellingCode', group.sellingCode, group.id)}</div></div>`).join('');
}
function pricingSection(item) {
  return `<section class="form-section" aria-label="Pricing and valuation">${sectionTitle('05', 'Pricing and valuation')}<div class="fields-grid">${financialFields('Recorded production cost ($)', 'productionCost', item.productionCost, 'Production cost code', 'productionCode', item.productionCode)}<div class="pricing-help">Enter the recorded cost directly. This field is not calculated.</div>${field('Retail selling price ($)', 'retail', item.retail, { numeric: true })}${field('Insurance value ($)', 'insurance', item.insurance, { numeric: true, help: 'Enter independently from the retail selling price.' })}</div></section>`;
}

function readRoute() { return location.hash.slice(1) || 'inventory'; }
function recordFor(value) { return items.find(item => item.id === value.split('/')[1]); }
function render(target, confirmation = '') {
  clearTimeout(confirmationTimer);
  route = target;
  photoBusy = false;
  let content;
  if (storageError || target === 'inventory') {
    draft = null;
    content = inventoryView(items, search, storageError);
    document.title = 'Inventory · Jewelry inventory';
  } else if (editorRoute(target)) {
    const editing = target.startsWith('edit/');
    const existing = editing ? recordFor(target) : null;
    if (editing && !existing) return renderNotFound();
    draft = editing ? clone(existing) : emptyItem();
    originalDraft = JSON.stringify(draft);
    photoBusy = false;
    content = editorView(draft, editing);
    document.title = `${editing ? 'Edit' : 'Add'} item · Jewelry inventory`;
  } else if (target.startsWith('item/')) {
    draft = null;
    const item = recordFor(target);
    if (!item) return renderNotFound();
    content = detailView(item, confirmation);
    document.title = `${item.inventory} · Jewelry inventory`;
  } else return renderNotFound();
  app.innerHTML = shell(content);
  wireDialog();
  window.scrollTo(0, 0);
  if (confirmation) confirmationTimer = setTimeout(() => document.querySelector('.save-confirmation')?.remove(), 6500);
}
function renderNotFound() {
  draft = null;
  app.innerHTML = shell(`<main class="page" id="main" tabindex="-1">${emptyState('Item not found', 'This item is not in the current inventory.', button('Back to inventory', 'inventory', { primary: true }))}</main>`);
  wireDialog();
}
function requestDiscard() {
  if (!dirty() && !photoBusy) return Promise.resolve(true);
  if (discardResolve) return Promise.resolve(false);
  return new Promise(resolve => {
    discardResolve = resolve;
    document.getElementById('discard-dialog').showModal();
    document.querySelector('[data-action="keep-editing"]').focus();
  });
}
function settleDiscard(discard) {
  document.getElementById('discard-dialog').close();
  const resolve = discardResolve;
  discardResolve = null;
  resolve?.(discard);
}
function wireDialog() {
  document.getElementById('discard-dialog').addEventListener('cancel', event => {
    event.preventDefault();
    settleDiscard(false);
  });
}
async function navigate(target, confirmation = '', saved = false) {
  if (!saved && !await requestDiscard()) return;
  historyIndex += 1;
  history.pushState({ jewelIndex: historyIndex }, '', `#${target}`);
  render(target, confirmation);
  document.getElementById('main')?.focus({ preventScroll: true });
}
window.addEventListener('popstate', async event => {
  if (restoringHistory) { restoringHistory = false; return; }
  const target = readRoute();
  const targetIndex = event.state?.jewelIndex;
  if (dirty() || photoBusy) {
    if (acceptingBack) acceptingBack = false;
    else if (Number.isInteger(targetIndex)) {
      const distance = targetIndex - historyIndex;
      restoringHistory = true;
      history.go(-distance);
      const discard = await requestDiscard();
      if (discard) { acceptingBack = true; history.go(distance); }
      return;
    } else {
      history.replaceState({ jewelIndex: historyIndex }, '', `#${route}`);
      if (await requestDiscard()) navigate(target, '', true);
      return;
    }
  }
  historyIndex = Number.isInteger(targetIndex) ? targetIndex : historyIndex + 1;
  history.replaceState({ jewelIndex: historyIndex }, '', `#${target}`);
  render(target);
  document.getElementById('main')?.focus({ preventScroll: true });
});
window.addEventListener('beforeunload', event => {
  if (dirty() || photoBusy || memoryChanges) { event.preventDefault(); event.returnValue = ''; }
});

app.addEventListener('input', event => {
  const input = event.target;
  if (input.id === 'inventory-search') { search = input.value; updateSearch(); return; }
  if (!draft || !input.name) return;
  if (input.name.includes(':')) {
    const [id, key] = input.name.split(':');
    const group = draft.groups.find(value => value.id === id);
    if (group) group[key] = input.value;
  } else draft[input.name] = input.value;
  input.removeAttribute('aria-invalid');
  const error = document.getElementById(`${input.id}-error`);
  if (error) error.hidden = true;
});
function updateSearch() {
  document.getElementById('inventory-results').innerHTML = inventoryResults(items, search);
  const count = matchingItems(items, search).length;
  document.getElementById('result-count').textContent = `${count} ${count === 1 ? 'item' : 'items'}${search.trim() ? ' found' : ' in inventory'}`;
  document.querySelector('.search-clear').hidden = !search;
}
app.addEventListener('click', async event => {
  const externalLink = event.target.closest('a[data-external]');
  if (externalLink) {
    event.preventDefault();
    if (await requestDiscard()) { draft = null; photoBusy = false; location.href = externalLink.href; }
    return;
  }
  const control = event.target.closest('[data-action]');
  if (!control) return;
  const action = control.dataset.action;
  const id = control.dataset.id;
  if (action === 'keep-editing' || action === 'discard') { settleDiscard(action === 'discard'); return; }
  if (action === 'inventory') return navigate('inventory');
  if (action === 'add') return navigate('add');
  if (action === 'view') return navigate(`item/${id}`);
  if (action === 'edit') return navigate(`edit/${id}`);
  if (action === 'reload') { ({ items, error: storageError } = loadItems()); render('inventory'); return; }
  if (action === 'clear-search') { search = ''; document.getElementById('inventory-search').value = ''; updateSearch(); document.getElementById('inventory-search').focus(); return; }
  if (action === 'select-photo') {
    const photo = recordFor(route)?.photos.find(value => value.id === id);
    if (photo) {
      document.getElementById('large-photo').innerHTML = photoImage(photo, 'detail-photo');
      document.querySelectorAll('.photo-thumb').forEach(thumb => { const selected = thumb.dataset.id === id; thumb.classList.toggle('selected', selected); thumb.setAttribute('aria-pressed', String(selected)); });
    }
    return;
  }
  if (!draft) return;
  if (action === 'cancel') return navigate(route.startsWith('edit/') ? `item/${draft.id}` : 'inventory');
  if (action === 'clear-date') {
    for (const key of ['month', 'year']) { draft[key] = ''; document.getElementById(key).value = ''; document.getElementById(`${key}-error`).hidden = true; document.getElementById(key).removeAttribute('aria-invalid'); }
  }
  if (action === 'add-group') {
    const group = emptyGroup(); draft.groups.push(group); refreshGroups(); document.getElementById(`group-${group.id}-type`).focus();
  }
  if (action === 'remove-group') {
    draft.groups = draft.groups.filter(group => group.id !== id); refreshGroups(); document.querySelector('[data-action="add-group"]').focus({ preventScroll: true });
  }
  if (action === 'make-cover') {
    const photo = draft.photos.find(value => value.id === id);
    if (photo) draft.photos = [photo, ...draft.photos.filter(value => value.id !== id)];
    refreshPhotos(); document.querySelector('[data-action="remove-photo"]')?.focus({ preventScroll: true });
  }
  if (action === 'remove-photo') { draft.photos = draft.photos.filter(value => value.id !== id); refreshPhotos(); document.getElementById('photo-input').focus({ preventScroll: true }); }
});
function refreshGroups() { document.getElementById('editor-groups').innerHTML = editorGroups(draft); }
function refreshPhotos() { document.getElementById('editor-photos').innerHTML = editorPhotos(draft); }
app.addEventListener('change', async event => {
  if (event.target.id !== 'photo-input' || !draft) return;
  const files = [...event.target.files];
  event.target.value = '';
  if (!files.length) return;
  const currentDraft = draft;
  const photoError = document.getElementById('photo-error');
  const progress = document.getElementById('photo-progress');
  photoError.hidden = true;
  photoBusy = true;
  const submit = document.querySelector('[type="submit"]');
  submit.disabled = true;
  event.target.disabled = true;
  const failures = [];
  for (const [index, file] of files.entries()) {
    if (draft !== currentDraft) break;
    progress.textContent = `Preparing photo ${index + 1} of ${files.length}…`;
    try {
      const photo = await preparePhoto(file);
      if (draft === currentDraft) { draft.photos.push(photo); refreshPhotos(); }
    } catch (error) { failures.push(error.message); }
  }
  if (draft !== currentDraft) return;
  photoBusy = false;
  submit.disabled = false;
  event.target.disabled = false;
  progress.textContent = failures.length ? '' : `${files.length} ${files.length === 1 ? 'photo' : 'photos'} added to this draft.`;
  if (failures.length) { photoError.textContent = failures.join(' '); photoError.hidden = false; }
});
app.addEventListener('submit', event => {
  if (event.target.id !== 'item-form') return;
  event.preventDefault();
  if (!draft || photoBusy) return;
  document.querySelectorAll('.field-error').forEach(element => { if (element.id !== 'photo-error') element.hidden = true; });
  document.querySelectorAll('[aria-invalid]').forEach(element => element.removeAttribute('aria-invalid'));
  const { item, errors } = validateItem(draft, items);
  const notice = document.getElementById('form-error');
  const entries = Object.entries(errors);
  if (entries.length) {
    notice.textContent = `Please check ${entries.length === 1 ? 'the highlighted field' : `the ${entries.length} highlighted fields`} below. Your changes have not been saved.`;
    notice.hidden = false;
    for (const [key, message] of entries) {
      const input = document.getElementById(key);
      const label = document.getElementById(`${key}-error`);
      if (input && label) { input.setAttribute('aria-invalid', 'true'); label.textContent = message; label.hidden = false; }
    }
    document.querySelector('[aria-invalid="true"]')?.focus();
    return;
  }
  const updated = items.some(value => value.id === item.id) ? items.map(value => value.id === item.id ? item : value) : [...items, item];
  try {
    const persisted = saveItems(updated);
    items = updated;
    if (!persisted) memoryChanges = true;
    navigate(`item/${item.id}`, persisted ? 'Item saved in this browser.' : 'Item updated in memory only. Changes will be lost when this tab closes or reloads.', true);
  } catch (error) { notice.textContent = error.message; notice.hidden = false; notice.scrollIntoView({ block: 'center', behavior: 'auto' }); }
});
history.replaceState({ jewelIndex: historyIndex }, '', `#${readRoute()}`);
render(readRoute());

document.querySelector('.skip-link').addEventListener('click', event => { event.preventDefault(); document.getElementById('main')?.focus(); });

})();
</script>
</body>
</html>
